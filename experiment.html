<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>RETURN GRID | Experiment Stage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-experiment">
  <div class="scanlines" aria-hidden="true"></div>
  <main class="screen experiment-screen">
    <header class="topbar">
      <a class="wordmark" href="main.html" aria-label="メインメニューへ戻る">RG<span>／</span>SYS</a>
      <div class="system-label"><span class="status-dot"></span> TEST AREA 00</div>
    </header>

    <section class="experiment-content">
      <div class="eyebrow"><span class="eyebrow-line"></span> EXPERIMENT / STAGE 00</div>
      <h1>TEST <span>AREA</span></h1>
      <p class="subtitle">SYSTEMS UNDER CONSTRUCTION</p>

      <div class="arena-frame" aria-label="実験ステージの仮画面">
        <div class="arena-grid"></div>
        <div class="arena-center">
          <div class="loading-ring" aria-hidden="true"></div>
          <span class="arena-code">LAB-00</span>
          <strong>実験ステージ準備中</strong>
          <p>ここにプレイヤー・ブーメラン・敵を実装していきます。</p>
        </div>
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>

      <a class="secondary-button" href="main.html"><span aria-hidden="true">←</span> メインメニューへ戻る</a>
    </section>

    <footer class="footer">
      <span>RETURN GRID <span class="muted">/ EXPERIMENT</span></span>
      <span class="build-label"><span class="status-dot"></span> NAVIGATION OK</span>
    </footer>
  </main>
</body>
</html>
