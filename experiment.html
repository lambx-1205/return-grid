<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>RETURN GRID | Movement Test</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/experiment.js" defer></script>
</head>
<body class="page page-experiment">
  <div class="scanlines" aria-hidden="true"></div>
  <main class="screen experiment-screen">
    <header class="topbar">
      <a class="wordmark" href="main.html" aria-label="メインメニューへ戻る">RG<span>／</span>SYS</a>
      <div class="system-label"><span class="status-dot"></span> MOVEMENT LAB / 00</div>
    </header>

    <section class="experiment-content" aria-labelledby="stage-title">
      <div class="stage-heading">
        <div>
          <div class="eyebrow"><span class="eyebrow-line"></span> EXPERIMENT / STAGE 00</div>
          <h1 id="stage-title">TEST <span>AREA</span></h1>
        </div>
        <div class="stage-badge"><span class="status-dot"></span> GRID 23 × 11</div>
      </div>

      <div id="game-arena" class="game-arena" role="application" aria-label="実験ステージ。23列11行のグリッドです。W、A、S、Dキーまたは矢印キーでプレイヤーを移動できます。斜め移動はなく、同時押しでは最後に押した方向が優先されます。" tabindex="0">
        <div class="arena-grid" aria-hidden="true"></div>
        <div class="arena-glow" aria-hidden="true"></div>

        <div id="player" class="player" role="img" aria-label="プレイヤー。発光するスライム">
          <span class="player-trail" aria-hidden="true"></span>
          <span class="player-shadow" aria-hidden="true"></span>
          <span class="player-body">
            <span class="player-highlight" aria-hidden="true"></span>
            <span class="player-eye" aria-hidden="true">
              <span class="player-eye-shine"></span>
            </span>
            <span class="player-cheek player-cheek-left" aria-hidden="true"></span>
            <span class="player-cheek player-cheek-right" aria-hidden="true"></span>
          </span>
        </div>
      </div>

      <div class="stage-controls">
        <div class="movement-guide">
          <span class="keycap">W</span>
          <span class="key-row">
            <span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span>
          </span>
          <span class="guide-text">MOVE</span>
          <span class="guide-divider"></span>
          <span class="keycap keycap-arrow">↑</span><span class="keycap keycap-arrow">←</span><span class="keycap keycap-arrow">↓</span><span class="keycap keycap-arrow">→</span>
          <span class="guide-text guide-secondary">斜め移動なし · 同時押しは最後の方向を優先</span>
        </div>
        <div class="movement-readout">
          <span class="readout-label">MOTION</span>
          <strong id="movement-status" aria-live="polite">STANDBY</strong>
        </div>
        <a class="secondary-button stage-back-button" href="main.html"><span aria-hidden="true">←</span> メニュー</a>
      </div>
    </section>

    <footer class="footer">
      <span>RETURN GRID <span class="muted">/ MOVEMENT TEST</span></span>
      <span class="build-label"><span class="status-dot"></span> INPUT READY</span>
    </footer>
  </main>
</body>
</html>
