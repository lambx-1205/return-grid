<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>RETURN GRID | Main Menu</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="page page-menu">
  <div class="scanlines" aria-hidden="true"></div>
  <main class="screen menu-screen">
    <header class="topbar">
      <a class="wordmark" href="main.html" aria-label="RETURN GRID ホーム">RG<span>／</span>SYS</a>
      <div class="system-label"><span class="status-dot"></span> SYSTEM ONLINE</div>
    </header>

    <section class="menu-content" aria-labelledby="game-title">
      <div class="eyebrow"><span class="eyebrow-line"></span> NEON ACTION PROTOTYPE / 00</div>
      <div class="mascot" role="img" aria-label="丸くてポップな青緑色のマスコット">
        <span class="mascot-eye eye-left"></span>
        <span class="mascot-eye eye-right"></span>
        <span class="mascot-cheek cheek-left"></span>
        <span class="mascot-cheek cheek-right"></span>
      </div>
      <h1 id="game-title">RETURN <span>GRID</span></h1>
      <p class="subtitle">THROW. TURN. RETURN.</p>
      <p class="intro">ネオンに包まれたアリーナを駆け抜けろ。<br>ブーメラン・アクション、開発実験中。</p>

      <button class="primary-button" id="start-button" type="button">
        <span class="button-icon" aria-hidden="true">▶</span>
        <span class="button-label">実験ステージへ</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </button>
      <p class="hint">PRESS TO ENTER THE TEST AREA</p>
    </section>

    <footer class="footer">
      <span>RETURN GRID <span class="muted">/ EARLY BUILD</span></span>
      <span class="build-label"><span class="status-dot"></span> BUILD 00.1</span>
    </footer>
  </main>
</body>
</html>
